spring.application.name=clearfolio-resume-parser
spring.config.import=optional:file:.env[.properties]
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:10}MB
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-exception=false
server.port=${PORT:${BACKEND_PORT:8000}}
server.address=${BACKEND_HOST:127.0.0.1}
