services:
  - type: web
    name: clearfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 10000
      - key: MAX_UPLOAD_MB
        value: 10
      - key: DATABASE_PATH
        value: data/resume_history.sqlite3
      - key: FRONTEND_ORIGIN
        value: https://clearfolio-dih4.onrender.com
  - type: web
    name: clearfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://clearfolio-api-dih4.onrender.com/api
